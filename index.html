<!DOCTYPE html>
<html lang="zh-Hant">

<head>
	<meta charset="utf-8">
	<title>Painterly Stroke Tool (2D)</title>
	<link rel="stylesheet" href="./style.css">
	<script src="./p5.min.js"></script>
	<script src="./painterly.js"></script>
	<script src="./sketch.js"></script>
</head>

<body>
	<div id="app">
		<div id="sketch-holder"></div>
		<aside id="panel">
			<h1>Painterly Stroke</h1>
			<p class="hint">
				<b>1</b> 畫作 &nbsp; <b>2</b> 色塊 &nbsp; <b>3</b> 筆觸 &nbsp; <b>4</b> 生成<br>
				<b>R</b> 換 seed &nbsp; <b>G</b> 顆粒 &nbsp; <b>S</b> 存檔<br>
				「靜音」可整組關掉，用來判斷效果來自哪一層。
			</p>
			<div id="controls"></div>
		</aside>
	</div>
